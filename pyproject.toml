[project]
name = "ava"
version = "0.1.0"
description = "AVA — a terminal personal assistant built on the OpenAI Agents SDK"
requires-python = ">=3.10"
dependencies = [
    "openai-agents",
    "mcp>=1.19.0,<3",
]

# Install ava itself in editable mode so `import ava` works from any script,
# not only under pytest (which injects pythonpath=["src"]).
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ava"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not slow'"
markers = [
    "slow: launches a real subprocess or network; run with -m slow",
]
